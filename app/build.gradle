plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.jetbrains.kotlin.android)
}

// ==================== release 签名（本机私有，勿提交） ====================
// 复用业务应用的 keystore：keystore.properties + keystore/*.jks 已在 .gitignore 排除。
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
} else {
    logger.warn('[YPlus] 缺少 keystore.properties → release 将产出未签名 APK')
}

android {
    namespace 'com.anrays.yplus'
    compileSdk rootProject.ext.compileSdkVersion

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId "com.anrays.yplus"
        minSdk rootProject.ext.minSdk
        targetSdk rootProject.ext.targetSdkVersion
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
            excludes.add("**/libandroidx.graphics.path.so")
        }
        resources {
            excludes.add("**/libandroidx.graphics.path.so")
        }
    }

    // 产物命名对齐 YPLUS 格式：<Name>_v<版本>_<yyyyMMdd_HHmm>.apk（前缀 YPLUS，与业务应用同系命名）
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            def date = new Date().format('yyyyMMdd_HHmm', TimeZone.getTimeZone('Asia/Hong_Kong'))
            // 版本段：versionName 非空用 versionName；为空则 versionCode 逐位换算（与 YPLUS 一致）
            def vName = (variant.versionName != null && !variant.versionName.isEmpty())
                    ? variant.versionName
                    : String.valueOf(variant.versionCode).toList().join('.')
            output.outputFileName = "YPLUS_v${vName}_${date}.apk"
        }
    }
}

dependencies {
    implementation project(':Bcore')

    implementation libs.appcompat
    implementation libs.material
    implementation libs.core.ktx
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}

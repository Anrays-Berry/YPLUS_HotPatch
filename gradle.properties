







org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# 必须用 JDK 17。若你的 Gradle 找不到 JDK 17，请取消下一行注释并改成自己的路径，
# 或在本地 gradle.properties / 命令行 -Dorg.gradle.java.home=... 指定（勿提交本机路径）。
# org.gradle.java.home=C:/Program Files/Java/jdk-17







android.useAndroidX=true



android.nonTransitiveRClass=true
android.enableJetifier=true
android.javaCompile.suppressSourceTargetDeprecationWarning=true
android.suppressUnsupportedCompileSdk=35


android.enableAnnotationProcessorIncremental=true
android.enableAnnotationProcessorParallel=true
// 项目路径含非 ASCII 字符（中文「工程」），绕过 AGP 路径校验（Windows 下中文路径需要）
android.overridePathCheck=true
